services:
  postgres-db:
    image: postgres:15
    container_name: agriculture-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agriculture_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - agriculture_postgres_data:/var/lib/postgresql/data
    networks:
      - agriculture-network

  ml-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: agriculture-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - agriculture-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agriculture-backend
    restart: unless-stopped
    depends_on:
      - postgres-db
      - ml-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/agriculture_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      ML_SERVICE_URL: http://ml-service:8000
    ports:
      - "8080:8080"
    networks:
      - agriculture-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agriculture-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - agriculture-network

volumes:
  agriculture_postgres_data:

networks:
  agriculture-network:
    driver: bridge